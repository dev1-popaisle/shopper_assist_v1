[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "product-crawler"
version = "0.1.0"
description = "Read a URL file and save each product's images and structured data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "crawl4ai>=0.6.3",
  "curl_cffi>=0.10.0",
  "duckdb>=1.1.0",
  "fastapi>=0.115.0",
  "FalkorDB>=1.2",
  "httpx>=0.27.0",
  "playwright>=1.48.0",
  "scrapy>=2.11.0",
  "uvicorn>=0.32.0",
]

[project.scripts]
product-crawler = "product_crawler.cli:main"
product-server = "product_crawler.server:main"

[tool.setuptools.packages.find]
where = ["src"]
